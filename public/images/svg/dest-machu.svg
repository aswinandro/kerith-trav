    <g fill="#1c5c38">
      <path d="M0 500h800v18H0z"/><path d="M0 534h800v16H0z"/><path d="M0 566h800v14H0z"/>
    </g>
    <g stroke="#0e3b24" stroke-width="3" fill="none"><path d="M0 518h800"/><path d="M0 550h800"/></g>
