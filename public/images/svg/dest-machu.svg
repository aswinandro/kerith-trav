      <stop offset="0%" stop-color="#0a1f2e"/><stop offset="50%" stop-color="#2b6f7f"/><stop offset="100%" stop-color="#bfe3c8"/>
    </linearGradient>
    <linearGradient id="mfar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f5f6d"/><stop offset="100%" stop-color="#173a46"/></linearGradient>
    <linearGradient id="mmid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1f4a4b"/><stop offset="100%" stop-color="#123330"/></linearGradient>
    <linearGradient id="mnear" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f7d4f"/><stop offset="100%" stop-color="#12452b"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#msky)"/>
  <circle cx="170" cy="130" r="58" fill="#fff7d6" opacity=".85"/>
  <path d="M690 40c-40 0-64 26-64 54 30-16 60-14 84 4 18 14 40 12 54-6-14-32-40-52-74-52z" fill="#eaf6ef" opacity=".55"/>
