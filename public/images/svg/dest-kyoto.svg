<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Kyoto illustration">
  <defs>
    <linearGradient id="ksky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/><stop offset="55%" stop-color="#5b3a6e"/><stop offset="100%" stop-color="#ffb08a"/>
    </linearGradient>
    <linearGradient id="kfuji" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5f6ea8"/><stop offset="100%" stop-color="#2b3160"/></linearGradient>
    <linearGradient id="kground" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a2140"/><stop offset="100%" stop-color="#150f26"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ksky)"/>
  <circle cx="150" cy="130" r="52" fill="#fff2d8" opacity=".9"/>
  <!-- fuji -->
  <path d="M470 380l140-190 140 190z" fill="url(#kfuji)"/>
  <path d="M610 190l52 70-52 34-50-36z" fill="#f4f6ff" opacity=".9"/>
  <g fill="#fff" opacity=".7"><circle cx="380" cy="80" r="1.5"/><circle cx="520" cy="60" r="1.3"/><circle cx="700" cy="110" r="1.6"/><circle cx="260" cy="60" r="1.3"/></g>
  <!-- pagoda -->
  <g transform="translate(470 210)">
    <rect x="52" y="30" width="16" height="150" fill="#3a2417"/>
    <g fill="#7d2f2a" stroke="#4a1a17" stroke-width="2">
      <path d="M-6 70h132l-22 22H16z"/><path d="M6 110h112l-20 20H26z"/><path d="M18 148h88l-18 18H36z"/>
    </g>
    <g fill="#f3e3cf"><rect x="40" y="46" width="40" height="24" rx="3"/><rect x="34" y="90" width="52" height="20" rx="3"/><rect x="44" y="130" width="32" height="18" rx="3"/></g>
    <rect x="56" y="6" width="8" height="26" fill="#c9a227"/><circle cx="60" cy="4" r="7" fill="#c9a227"/>
  </g>
  <!-- torii gate -->
  <g transform="translate(120 300)" fill="#d1462f" stroke="#8f2a1c" stroke-width="3">
    <path d="M-24 10h248l-14-24H-10z"/>
    <path d="M-4 46h208v18H-4z"/>
    <rect x="24" y="10" width="26" height="190"/><rect x="174" y="10" width="26" height="190"/>
    <rect x="106" y="46" width="12" height="70"/>
  </g>
  <!-- ground -->
  <path d="M0 470c140-26 260 14 400-4s260-26 400-4v138H0z" fill="url(#kground)"/>
  <g stroke="#3b2f57" stroke-width="3" fill="none" opacity=".7"><path d="M0 520c140-24 260 14 400-4s260-24 400-4"/></g>
  <!-- sakura branch -->
  <g stroke="#3a2417" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M800 60c-70 10-130 40-180 84-40 34-78 56-120 66"/>
    <path d="M660 118c-24-26-58-40-96-44"/>
    <path d="M540 176c-18 24-42 40-70 48"/>
  </g>
  <g fill="#ffc2d4">
    <circle cx="700" cy="88" r="12"/><circle cx="648" cy="112" r="10"/><circle cx="600" cy="140" r="13"/><circle cx="556" cy="172" r="10"/>
    <circle cx="512" cy="196" r="12"/><circle cx="590" cy="86" r="9"/><circle cx="540" cy="122" r="10"/><circle cx="470" cy="212" r="9"/>
    <circle cx="676" cy="146" r="9"/><circle cx="740" cy="66" r="10"/>
  </g>
  <g fill="#fff0f5" opacity=".9">
    <circle cx="704" cy="84" r="4"/><circle cx="604" cy="136" r="4"/><circle cx="516" cy="192" r="4"/>
  </g>
  <!-- falling petals -->
  <g fill="#ffc2d4" opacity=".85">
    <ellipse cx="330" cy="240" rx="7" ry="5" transform="rotate(25 330 240)"/>
    <ellipse cx="270" cy="330" rx="6" ry="4" transform="rotate(-20 270 330)"/>
    <ellipse cx="390" cy="360" rx="7" ry="5" transform="rotate(40 390 360)"/>
    <ellipse cx="200" cy="200" rx="6" ry="4" transform="rotate(10 200 200)"/>
    <ellipse cx="440" cy="270" rx="6" ry="4" transform="rotate(-35 440 270)"/>
